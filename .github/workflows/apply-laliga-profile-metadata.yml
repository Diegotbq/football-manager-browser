name: Apply verified LALIGA player profile metadata

on:
  push:
    branches: [main]
    paths:
      - "data/approvals/laliga-player-profile-metadata-2026-27.json"
      - "scripts/apply_laliga_profile_metadata.py"
      - "scripts/test_apply_laliga_profile_metadata.py"
      - "data/approvals/openfootballbase-atletico-metadata-2026-27.json"
      - "scripts/apply_openfootballbase_verified_metadata.py"
      - "scripts/test_apply_openfootballbase_verified_metadata.py"
      - "data/approvals/roster-corrections-laliga-2026-27.json"
      - "scripts/apply_roster_corrections.py"
      - "scripts/test_apply_roster_corrections.py"
      - ".github/workflows/apply-laliga-profile-metadata.yml"

permissions:
  contents: write

jobs:
  apply-verified-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run regression tests
        run: python -m unittest scripts/test_apply_laliga_profile_metadata.py scripts/test_apply_openfootballbase_verified_metadata.py scripts/test_apply_roster_corrections.py
      - name: Correct verified current-club assignments
        run: |
          python scripts/apply_roster_corrections.py --database database.json --approval data/approvals/roster-corrections-laliga-2026-27.json --out /tmp/database-corrected.json --report /tmp/roster-corrections-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/roster-corrections-report.json").read_text())
          approval = json.loads(Path("data/approvals/roster-corrections-laliga-2026-27.json").read_text())
          if len(report["operations"]) != len(approval["operations"]):
              raise SystemExit("Not all approved club corrections were applied")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Apply exact-identity, fill-only profile metadata
        run: |
          python scripts/apply_laliga_profile_metadata.py \
            --database /tmp/database-corrected.json \
            --approval data/approvals/laliga-player-profile-metadata-2026-27.json \
            --out /tmp/database-updated.json \
            --report /tmp/laliga-profile-metadata-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/laliga-profile-metadata-report.json").read_text())
          approval = json.loads(Path("data/approvals/laliga-player-profile-metadata-2026-27.json").read_text())
          expected = len(approval["records"])
          if report["matched"] != expected:
              raise SystemExit(f"Expected exactly {expected} approved player identity matches")
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
      - name: Apply manually reviewed OpenFootballBase metadata
        run: python scripts/apply_openfootballbase_verified_metadata.py --database /tmp/database-updated.json --approval data/approvals/openfootballbase-atletico-metadata-2026-27.json --out /tmp/database-final.json --report /tmp/openfootballbase-metadata-report.json
      - name: Commit database update
        run: |
          set -euo pipefail
          cp /tmp/database-final.json database.json
          WRITE_ROSTER_AUDIT=1 node scripts/audit-rosters.mjs database.json > /tmp/final-roster-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/final-roster-audit.json").read_text())
          league = report["leagues"].get("la-liga")
          if league is None:
              raise SystemExit("La Liga missing from final roster audit")
          checks = {
              "20 clubs": league["clubs"] == 20,
              "all clubs have players": league["clubsWithPlayers"] == 20,
              "all player ages filled": league["metadataCompleteness"]["missing"]["age"] == 0,
              "all player nationalities filled": league["metadataCompleteness"]["missing"]["nationality"] == 0,
              "no duplicate player IDs": report["integrity"]["duplicatePlayerIds"] == 0,
              "no players without valid team": report["integrity"]["playersWithoutValidTeam"] == 0,
              "no squad reference issues": report["integrity"]["clubsWithSquadReferenceIssues"] == 0,
              "no clubs below minimum": league["clubsBelowMinimum"] == 0,
          }
          print(json.dumps({"checks": checks, "laLiga": league, "integrity": report["integrity"]}, ensure_ascii=False, indent=2))
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise SystemExit("Final La Liga audit failed: " + ", ".join(failed))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database.json data/roster-audit.json
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Fill verified LaLiga player profile metadata"
            git pull --rebase origin main
            git push
          fi
