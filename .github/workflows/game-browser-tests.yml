name: Game browser smoke tests

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "database.json"
      - "js/**"
      - "css/**"
      - "tests/e2e/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/game-browser-tests.yml"
  pull_request:
    paths:
      - "index.html"
      - "database.json"
      - "js/**"
      - "css/**"
      - "tests/e2e/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/game-browser-tests.yml"

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/leagues.js
      - name: Run browser gameplay smoke tests
        run: npm run test:game
