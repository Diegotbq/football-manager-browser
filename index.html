<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Manager Browser</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>⚽ Football Manager Browser</h1>
    <p>Temporada 2025/26</p>
  </header>

  <nav>
    <button data-view="dashboard">Início</button>
    <button data-view="squad">Elenco</button>
    <button data-view="tactics">Táticas</button>
    <button data-view="market">Mercado</button>
    <button data-view="table">Tabelas</button>
    <button data-view="calendar">Calendário</button>
  </nav>

  <main id="app">
    <h2>Bem-vindo, treinador!</h2>
    <p>Prepare sua equipe para conquistar o mundo.</p>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
