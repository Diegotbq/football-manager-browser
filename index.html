<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#101827"><title>Football Manager Browser</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">FM</span><div><strong>FOOTBALL</strong><small>MANAGER BROWSER</small></div></div>
    <div class="club-chip"><div class="club-crest">F</div><div><strong id="club-name">Carregando...</strong><small>Temporada 2026/27</small></div></div>
    <nav id="main-nav" aria-label="Menu principal">
      <button class="nav-item active" data-view="dashboard">▦ <span>Dashboard</span></button>
      <button class="nav-item" data-view="squad">♙ <span>Elenco / Táticas</span></button>
      <button class="nav-item" data-view="market">⇄ <span>Mercado</span></button>
      <button class="nav-item" data-view="table">☷ <span>Tabela</span></button>
      <button class="nav-item" data-view="calendar">▣ <span>Calendário</span></button>
      <button class="nav-item" data-view="match">⚽ <span>Partidas</span></button>
    </nav>
    <div class="sidebar-footer"><span class="status-dot"></span> Projeto em desenvolvimento <small>Versão 0.1.0</small></div>
  </aside>
  <main class="main-content">
    <header class="topbar"><div><p class="eyebrow">CENTRAL DO TREINADOR</p><h1 id="page-title">Dashboard</h1></div>
      <div class="top-actions"><div class="date-pill"><span>📅</span><strong id="current-date">01 JUL 2026</strong></div><button id="advance-day" class="primary-btn">Avançar 1 dia <span>→</span></button></div>
    </header>
    <section id="view-root" aria-live="polite"><div class="loading">Carregando banco de dados...</div></section>
  </main>
</div>
<script src="js/leagues.js"></script>
<script src="js/app.js"></script>
</body></html>
